[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-scraper"
version = "0.1.0"
description = "Proxy-aware product scraper that writes into the chain-store database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "camoufox[geoip]>=0.4.11",
    "curl_cffi>=0.7",
    "httpx>=0.27",
    "lxml>=5.0",
    "playwright>=1.49",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
product-scraper = "product_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
